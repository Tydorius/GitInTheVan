[project]
name = "gitinthevan"
version = "0.20.0"
description = "Self-hostable MITM LLM router/proxy for roleplay services"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "httpx==0.28.1",
    "sqlalchemy[asyncio]==2.0.50",
    "aiosqlite==0.22.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-jose[cryptography]==3.5.0",
    "bcrypt==5.0.0",
    "dulwich==1.2.6",
    "litellm==1.89.4",
    # Transitive deps pinned explicitly to patched versions per pip-audit findings
    # (2026-07-11, re-audited 2026-08-17 — see Planning/security-control-document.md).
    # Remove an explicit pin once the direct dependency that pulls it in
    # (fastapi -> starlette, python-jose -> cryptography/pyasn1, litellm -> aiohttp)
    # bumps its own floor past these versions.
    #
    # ecdsa is deliberately absent: python-jose requires it, but this app signs JWTs
    # with HS256 only (app/services/auth.py) so no ECDSA code path is reachable, and
    # upstream considers the Minerva timing attack (PYSEC-2026-1325) out of scope with
    # no planned fix. Revisit if JWT_ALGORITHM ever changes to an EC algorithm.
    "starlette==1.3.1",
    "cryptography==50.0.0",  # PYSEC-2026-3552/-3553/-3554
    "aiohttp==3.14.3",       # PYSEC-2026-3545/-3546/-3547
    "pyasn1==0.6.4",         # PYSEC-2026-3455/-3456/-3457
]

[project.optional-dependencies]
postgres = ["asyncpg==0.30.0"]
mysql = ["aiomysql==0.2.0"]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-httpx==0.36.2",
    "httpx==0.28.1",
    "ruff==0.15.15",
    "pip-audit==2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
